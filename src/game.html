<title>Theo!</title>
<meta name="theme-color" content="#0a2226">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bowlby+One+SC&family=Outfit:wght@400;500;600;700&display=swap">
<style>
/* Layout: a phone app. One screen at a time inside a phone-sized frame (full screen on a phone, a framed device on desktop): Play, City and Friends tabs on a bottom bar; the card table takes over the whole screen while you play. Deliberately single dark theme: a night table in a hostel common room. */
:root{
  --room:#06171a;          /* desktop backdrop */
  --rail:#0a2226;          /* app chrome */
  --table:#0f3036;
  --table-2:#17464f;
  --panel:#123a41;
  --ink:#f3ecdc;
  --muted:#93b3b1;
  --card:#fbf6ea;
  --card-edge:#d6cbb1;
  --red:#c8323c;
  --black:#1c2427;
  --joker:#6b4bb5;
  --accent:#f2b33d;
  --accent-ink:#2a1d04;
  --coin:#f7c94f;
  --good:#74d6a0;
  --bad:#ff7d6c;
  --display:"Bowlby One SC","Arial Black",Impact,sans-serif;
  --body:"Outfit",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  color-scheme:dark;
}
[hidden]{display:none!important}
html,body{height:100%}
body{margin:0;background:var(--room);color:var(--ink);font-family:var(--body);font-size:14px;-webkit-tap-highlight-color:transparent;display:grid;place-items:center}
button{font:inherit;color:inherit}
button:focus-visible,select:focus-visible,input:focus-visible{outline:2px solid var(--accent);outline-offset:2px}

.phone{position:relative;width:100%;height:100%;background:var(--rail);overflow:hidden;display:grid;grid-template-rows:auto minmax(0,1fr) auto;grid-template-columns:minmax(0,1fr);container-type:inline-size}
@media (min-width:520px){
  body{padding:16px;box-sizing:border-box;background:radial-gradient(ellipse at 50% 30%,#0e2c31,var(--room) 70%)}
  .phone{width:400px;height:min(100%,860px);border-radius:36px;box-shadow:0 0 0 10px #02090a,0 0 0 11px #1e3a3f,0 30px 80px rgba(0,0,0,.6)}
}
.phone.playing{grid-template-rows:minmax(0,1fr)}
.phone.playing .appbar,.phone.playing .nav{display:none}

/* app bar */
.appbar{display:flex;align-items:center;gap:8px;padding:12px 16px 8px}
.brand{font-family:var(--display);font-size:20px;line-height:1;color:var(--accent);margin-right:auto}
.rchip{display:flex;align-items:center;gap:6px;border-radius:999px;padding:5px 10px;background:var(--panel);font-weight:700;font-variant-numeric:tabular-nums;white-space:nowrap;font-size:13px}
.rchip small{font-weight:500;color:var(--muted);font-size:11px}
.rchip.bump{animation:bump .5s ease}
@keyframes bump{40%{transform:scale(1.15)}}
.ic-ticket{width:18px;height:12px;flex:none;background:radial-gradient(circle at 0 50%,transparent 3px,var(--accent) 3.5px) left/51% 100% no-repeat,radial-gradient(circle at 100% 50%,transparent 3px,var(--accent) 3.5px) right/51% 100% no-repeat}
.ic-coin{width:14px;height:14px;flex:none;border-radius:50%;background:var(--coin);box-shadow:inset 0 0 0 2px color-mix(in srgb,var(--coin) 60%,#7a5300)}
.iconbtn.off{color:var(--muted)}
.iconbtn{width:34px;height:34px;border-radius:50%;border:0;background:var(--panel);cursor:pointer;display:grid;place-items:center;font-size:16px}

/* bottom nav */
.nav{display:grid;grid-template-columns:repeat(3,1fr);padding:6px 8px calc(8px + env(safe-area-inset-bottom,0px));background:var(--rail);border-top:1px solid color-mix(in srgb,var(--ink) 8%,transparent)}
.nav button{border:0;background:none;cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:3px;padding:6px 0;color:var(--muted);font-size:11.5px;font-weight:600;border-radius:12px}
.nav button svg{width:24px;height:24px}
.nav button[aria-current="page"]{color:var(--accent)}
.nav button{position:relative}
.nav .dot{position:absolute;top:4px;left:calc(50% + 8px);width:8px;height:8px;border-radius:50%;background:var(--bad)}

.screen{min-height:0;overflow:auto;position:relative}
.pad{padding:4px 16px 20px;display:flex;flex-direction:column;gap:14px}

/* buttons */
.btn{font-weight:600;font-size:13px;border-radius:999px;padding:8px 14px;border:1px solid color-mix(in srgb,var(--ink) 28%,transparent);background:transparent;cursor:pointer}
.btn:disabled{opacity:.4;cursor:not-allowed}
.btn.primary{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.btn.wide{width:100%;border-radius:12px;padding:11px 14px}
.cta{width:100%;font-family:var(--display);font-size:24px;background:var(--accent);color:var(--accent-ink);border:0;border-radius:16px;padding:14px 12px 12px;cursor:pointer;box-shadow:0 5px 0 color-mix(in srgb,var(--accent) 50%,#000);display:flex;flex-direction:column;align-items:center;gap:2px}
.cta small{font-family:var(--body);font-size:13px;font-weight:600;opacity:.8}
.cta:active{transform:translateY(3px);box-shadow:0 2px 0 color-mix(in srgb,var(--accent) 50%,#000)}
.cta:disabled{opacity:.35;cursor:not-allowed;box-shadow:none}

/* play screen */
.hero{position:relative;border-radius:20px;overflow:hidden;height:200px;cursor:pointer;border:0;padding:0;background:var(--table);display:block;width:100%}
.hero svg{position:absolute;inset:0;width:100%;height:100%}
.hero .cap{position:absolute;left:0;right:0;bottom:0;padding:28px 14px 12px;background:linear-gradient(transparent,rgba(6,23,26,.85));text-align:left;display:flex;align-items:flex-end;justify-content:space-between;gap:8px}
.hero .cap b{display:block;font-family:var(--display);font-size:28px;line-height:1}
.hero .cap small{display:block;font-size:12px;color:var(--muted);font-weight:600;letter-spacing:.08em;text-transform:uppercase;margin-bottom:4px}
.hero .cap span.go{font-size:12.5px;font-weight:700;background:var(--card);color:var(--black);border-radius:999px;padding:5px 10px;white-space:nowrap}
.minibar{height:6px;border-radius:3px;background:rgba(255,255,255,.18);overflow:hidden;margin-top:8px;width:150px}
.minibar i{display:block;height:100%;background:var(--accent)}
.steps{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;list-style:none;margin:0;padding:0}
.steps li{display:flex;flex-direction:column;align-items:center;gap:5px;text-align:center;font-size:12px;font-weight:600;padding:10px 4px;border-radius:12px;background:var(--panel)}
.steps li i{font-style:normal;width:22px;height:22px;border-radius:50%;display:grid;place-items:center;background:var(--accent);color:var(--accent-ink);font-weight:700;font-size:12px}
.bet{display:flex;align-items:center;gap:10px}
.bet label{font-weight:600;font-size:13px;white-space:nowrap}
.seg{flex:1;display:grid;grid-template-columns:repeat(3,1fr);gap:4px;background:var(--panel);border-radius:12px;padding:4px}
.seg button{border:0;border-radius:9px;background:none;padding:7px 0;cursor:pointer;font-weight:700;display:flex;align-items:center;justify-content:center;gap:5px}
.seg button[aria-pressed="true"]{background:var(--accent);color:var(--accent-ink)}
.seg button[aria-pressed="true"] .ic-ticket{background:radial-gradient(circle at 0 50%,transparent 3px,var(--accent-ink) 3.5px) left/51% 100% no-repeat,radial-gradient(circle at 100% 50%,transparent 3px,var(--accent-ink) 3.5px) right/51% 100% no-repeat}
.note{font-size:12.5px;color:var(--muted);text-align:center;font-variant-numeric:tabular-nums}
.note b{color:var(--ink)}
.free{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.free button{border-radius:12px;border:1px dashed color-mix(in srgb,var(--ink) 28%,transparent);background:none;padding:10px 8px;cursor:pointer;font-weight:600;font-size:12.5px;display:flex;flex-direction:column;align-items:center;gap:2px}
.free button small{color:var(--muted);font-weight:500;font-size:11px}
.free button:disabled{opacity:.4;cursor:not-allowed}

/* city screen */
.cityscr{display:grid;grid-template-rows:auto minmax(0,1fr);height:100%;overflow:hidden}
.cityhead{padding:4px 16px 10px;display:flex;align-items:flex-end;justify-content:space-between;gap:10px}
.cityhead small{display:block;font-size:11px;color:var(--muted);font-weight:600;letter-spacing:.12em;text-transform:uppercase}
.cityhead h1{margin:2px 0 0;font-family:var(--display);font-size:30px;line-height:1}
.cityhead .prog{text-align:right;font-size:12px;font-weight:600;font-variant-numeric:tabular-nums;color:var(--muted)}
.cityhead .bar{width:120px;height:7px;border-radius:4px;background:color-mix(in srgb,var(--ink) 14%,transparent);overflow:hidden;margin-top:5px}
.cityhead .bar i{display:block;height:100%;background:var(--accent);transition:width .4s}
.scene{position:relative;min-height:0}
.scene svg{width:100%;height:100%;display:block}
.scene .hint{position:absolute;left:50%;top:10px;transform:translateX(-50%);background:rgba(6,23,26,.78);color:var(--ink);font-size:12.5px;font-weight:600;border-radius:999px;padding:6px 12px;white-space:nowrap;pointer-events:none}
.lm{cursor:pointer}
.lm .bodyg{transform-box:fill-box;transform-origin:50% 100%}
.lm.pop .bodyg{animation:grow .6s cubic-bezier(.2,1.6,.4,1)}
@keyframes grow{0%{transform:scale(.6,.2)}100%{transform:none}}
.lm .up{animation:bob 1s ease-in-out infinite}
@keyframes bob{50%{transform:translateY(-5px)}}
.lm:focus-visible{outline:none}
.lm:focus-visible .pillbg{stroke:var(--accent);stroke-width:2}

/* bottom sheet */
.bs{position:absolute;inset:0;z-index:25;display:flex;flex-direction:column;justify-content:flex-end;background:rgba(4,14,16,.55)}
.bs .sheetb{background:var(--table);border-radius:22px 22px 0 0;padding:10px 16px calc(18px + env(safe-area-inset-bottom,0px));animation:slide .25s ease}
@keyframes slide{from{transform:translateY(40px);opacity:0}}
.grab{width:40px;height:4px;border-radius:2px;background:color-mix(in srgb,var(--ink) 25%,transparent);margin:0 auto 10px}
.lmhead{display:flex;gap:12px;align-items:center;margin-bottom:12px}
.lmhead .pic{width:110px;height:110px;flex:none;border-radius:16px;background:linear-gradient(#cfe6ef,#f6e7c8)}
.lmhead h2{margin:0;font-family:var(--display);font-size:22px;line-height:1.05}
.lmhead p{margin:4px 0 0;color:var(--muted);font-size:13px;line-height:1.4}
.lvl{display:flex;gap:5px;margin-top:8px}
.lvl i{width:22px;height:6px;border-radius:3px;background:color-mix(in srgb,var(--ink) 18%,transparent)}
.lvl i.on{background:var(--accent)}
.buildbtn{width:100%;display:flex;align-items:center;justify-content:center;gap:8px;font-weight:700;font-size:16px;border-radius:14px;padding:13px;border:0;cursor:pointer;background:var(--accent);color:var(--accent-ink);font-variant-numeric:tabular-nums}
.buildbtn:disabled{background:color-mix(in srgb,var(--ink) 12%,transparent);color:var(--muted);cursor:not-allowed}
.short{margin:8px 0 0;text-align:center;font-size:12.5px;color:var(--muted)}

/* friends screen */
.card-panel{border-radius:18px;padding:16px;background:var(--panel)}
.card-panel h2{margin:0 0 6px;font-family:var(--display);font-size:22px;color:var(--accent)}
.card-panel p{margin:0 0 12px;color:var(--muted);line-height:1.45}
.soon{font-size:11px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;border-radius:999px;padding:2px 8px;background:color-mix(in srgb,var(--ink) 12%,transparent);color:var(--muted);margin-left:6px;vertical-align:3px}

/* table */
.tablescr{height:100%;display:grid;grid-template-rows:auto minmax(0,1fr);grid-template-columns:minmax(0,1fr)}
.tbar .iconbtn{flex:none}
.tbar .ttl small{overflow:hidden;text-overflow:ellipsis}
.tbar{display:flex;align-items:center;gap:8px;padding:12px 12px 6px}
.tbar .ttl{flex:1;min-width:0;font-weight:700;font-size:14px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tbar .ttl small{display:block;font-weight:500;color:var(--muted);font-size:11.5px}
.table{position:relative;min-height:0;display:grid;grid-template-rows:auto minmax(0,1fr) auto;gap:6px;margin:0 6px 6px;padding:12px 10px calc(12px + env(safe-area-inset-bottom,0px));border-radius:22px;background:radial-gradient(ellipse at 50% 42%,var(--table-2),var(--table) 72%);overflow:hidden}
.table::before{content:"";position:absolute;inset:6px;border:1.5px dashed color-mix(in srgb,var(--ink) 13%,transparent);border-radius:16px;pointer-events:none}
.opps{display:flex;gap:6px;justify-content:center;position:relative;z-index:2}
.opp{position:relative;flex:1 1 0;min-width:0;display:grid;grid-template-columns:auto minmax(0,1fr);align-items:center;gap:3px 6px;padding:6px 8px;border-radius:12px;background:color-mix(in srgb,var(--rail) 55%,transparent);border:1.5px solid transparent;transition:border-color .2s,box-shadow .2s}
.opp.active{border-color:var(--accent);box-shadow:0 0 0 3px color-mix(in srgb,var(--accent) 18%,transparent)}
.opp.out{opacity:.38}
.av{width:26px;height:26px;border-radius:50%;background:var(--av);color:var(--rail);display:grid;place-items:center;font-weight:700;font-size:12px}
.who b{display:block;font-size:13px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.thinking{font-size:10.5px;color:var(--accent);height:13px}
.meta{grid-column:1/-1;display:flex;justify-content:space-between;align-items:center}
.pts{font-weight:700;font-size:14px;font-variant-numeric:tabular-nums}
.backs{display:flex;padding-left:4px}
.bk{width:10px;height:14px;border-radius:2px;margin-left:-4px;background:var(--accent);border:1px solid var(--rail)}
.bubble{position:absolute;left:4px;right:4px;top:calc(100% + 8px);background:var(--card);color:var(--black);font-size:12px;font-weight:500;line-height:1.3;padding:6px 8px;border-radius:10px;box-shadow:0 6px 16px rgba(0,0,0,.35);animation:pop .25s ease both;z-index:3}
.bubble::before{content:"";position:absolute;top:-6px;left:16px;border:6px solid transparent;border-top:0;border-bottom-color:var(--card)}
@keyframes pop{from{transform:translateY(-4px);opacity:0}}
.center{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:12px;min-height:0;position:relative;z-index:1}
.piles{display:flex;gap:36px;align-items:flex-start}
.slot{display:flex;flex-direction:column;align-items:center;gap:8px}
.lbl{font-size:10.5px;font-weight:600;letter-spacing:.12em;text-transform:uppercase;color:var(--muted);text-align:center}
.lbl b{color:var(--ink);font-weight:600}
.deck{--cw:62px;position:relative;background:none;border:0;padding:0;cursor:default}
.deck .count{position:absolute;right:-8px;bottom:-8px;background:var(--rail);color:var(--ink);font-size:11px;font-weight:700;border-radius:999px;padding:2px 7px;font-variant-numeric:tabular-nums}
.deck.go{cursor:pointer}
.deck.go .card{box-shadow:0 0 0 3px var(--accent),0 0 22px color-mix(in srgb,var(--accent) 50%,transparent)}
.pile{--cw:62px;display:flex}
.pile .card+.card{margin-left:calc(var(--cw) * -0.42)}
.log{list-style:none;margin:0;padding:0 8px;font-size:12px;line-height:1.5;color:var(--muted);text-align:center;min-height:3em}
.log li:first-child{color:var(--ink)}
.card{--w:var(--cw,72px);width:var(--w);aspect-ratio:5/7;flex:none;position:relative;display:block;padding:0;border-radius:calc(var(--w) * .1);background:var(--card);color:var(--black);border:1px solid var(--card-edge);box-shadow:0 2px 0 var(--card-edge),0 6px 14px rgba(0,0,0,.28);user-select:none;transition:transform .15s ease,box-shadow .15s ease}
.card.red{color:var(--red)}
.card.joker{color:var(--joker)}
.card .idx{position:absolute;top:5%;left:8%;display:flex;flex-direction:column;align-items:center;font-weight:700;font-size:calc(var(--w) * .25);line-height:.95}
.card .idx i{font-style:normal;font-size:.78em}
.card .idx.br{top:auto;left:auto;bottom:5%;right:8%;transform:rotate(180deg)}
.card .pip{position:absolute;inset:0;display:grid;place-items:center;font-size:calc(var(--w) * .46)}
.card .jk{position:absolute;left:0;right:0;bottom:9%;text-align:center;font-family:var(--display);font-size:calc(var(--w) * .13)}
.card.back{border:3px solid var(--card);background:repeating-linear-gradient(45deg,var(--accent) 0 6px,color-mix(in srgb,var(--accent) 78%,var(--rail)) 6px 12px)}
.card.back::after{content:"T";position:absolute;inset:0;display:grid;place-items:center;font-family:var(--display);font-size:calc(var(--w) * .42);color:var(--accent-ink)}
button.card{cursor:pointer}
button.card:disabled{cursor:default}
.pile .card.pick{box-shadow:0 0 0 3px var(--accent),0 0 22px color-mix(in srgb,var(--accent) 50%,transparent);z-index:1}
.pile .card.hint{outline:2px dashed color-mix(in srgb,var(--accent) 70%,transparent);outline-offset:3px}
.pile .card.dim{filter:brightness(.72)}
.me{display:flex;flex-direction:column;align-items:center;gap:6px;position:relative;z-index:2}
.me-bar{width:100%;display:flex;flex-wrap:wrap;align-items:center;justify-content:center;gap:6px 8px}
.chip{font-size:12px;font-weight:600;border-radius:999px;padding:5px 10px;background:color-mix(in srgb,var(--rail) 65%,transparent);font-variant-numeric:tabular-nums;white-space:nowrap}
.chip.ok{color:var(--good)}
.status{flex:1 1 100%;order:-1;min-width:0;text-align:center;font-size:13.5px;line-height:1.4;min-height:2.8em;text-wrap:balance}
.status b{color:var(--accent);font-weight:600}
.status .warn{color:var(--bad)}
.sortbtn{font-size:12px;padding:5px 10px}
.yaniv{font-family:var(--display);font-size:18px;background:var(--accent);color:var(--accent-ink);border:0;border-radius:12px;padding:8px 16px;cursor:pointer;box-shadow:0 4px 0 color-mix(in srgb,var(--accent) 50%,#000)}
.yaniv:disabled{opacity:.3;cursor:not-allowed;box-shadow:none}
.yaniv.ready{animation:pulse 1.3s ease-in-out infinite}
@keyframes pulse{50%{box-shadow:0 4px 0 color-mix(in srgb,var(--accent) 50%,#000),0 0 0 8px color-mix(in srgb,var(--accent) 22%,transparent)}}
.hand{display:flex;justify-content:center;gap:5px;padding-top:18px;--cw:min(66px,calc((100cqw - 48px) / var(--n) - 5px))}
.hand .card.sel{transform:translateY(-16px);box-shadow:0 0 0 3px var(--accent),0 10px 18px rgba(0,0,0,.35)}
.hand .card.fresh{animation:fresh .7s ease}
@keyframes fresh{0%{transform:translateY(-30px) rotate(-6deg);opacity:0}100%{transform:none;opacity:1}}

/* overlays inside the phone */
.ov{position:absolute;inset:0;z-index:30;display:grid;place-items:center;padding:16px;background:rgba(4,14,16,.78)}
.sheet{width:100%;max-height:calc(100% - 16px);overflow:auto;background:var(--table);border:1px solid color-mix(in srgb,var(--ink) 16%,transparent);border-radius:20px;padding:18px;box-shadow:0 20px 60px rgba(0,0,0,.5);box-sizing:border-box}
.sheet h2{margin:0 0 6px;font-family:var(--display);font-size:28px;line-height:1.05;color:var(--accent);text-wrap:balance}
.sheet h2.asaf{color:var(--bad)}
.sheet h3{margin:16px 0 8px;font-size:13px;letter-spacing:.1em;text-transform:uppercase;color:var(--muted)}
.sheet p{margin:0 0 12px;line-height:1.5}
.sheet .foot{display:flex;gap:8px;justify-content:flex-end;flex-wrap:wrap;margin-top:14px}
.prize{display:flex;align-items:center;justify-content:space-between;gap:8px;flex-wrap:wrap;padding:12px 14px;border-radius:14px;margin-bottom:12px;background:color-mix(in srgb,var(--coin) 12%,transparent);box-shadow:inset 0 0 0 1.5px color-mix(in srgb,var(--coin) 45%,transparent)}
.prize .place{font-family:var(--display);font-size:20px}
.prize .amt{display:flex;align-items:center;gap:8px;font-size:22px;font-weight:700;color:var(--coin);font-variant-numeric:tabular-nums}
.prize .amt .ic-coin{width:18px;height:18px}
.prize small{display:block;width:100%;color:var(--muted);font-size:12px}
.rtable{display:grid;gap:6px}
.rrow{display:grid;grid-template-columns:minmax(0,1fr) auto auto;align-items:center;gap:4px 10px;padding:8px 10px;border-radius:10px;background:color-mix(in srgb,var(--rail) 55%,transparent);font-variant-numeric:tabular-nums}
.rrow.me{box-shadow:inset 0 0 0 1.5px color-mix(in srgb,var(--accent) 60%,transparent)}
.rrow .nm{font-weight:600;font-size:13.5px}
.rrow .nm small{display:block;font-weight:500;font-size:11px;color:var(--muted)}
.rrow .mini{grid-column:1/-1;display:flex;gap:3px;--cw:26px;flex-wrap:wrap}
.rrow .add{font-weight:700}
.rrow .add.zero{color:var(--good)}
.rrow .add.hit{color:var(--bad)}
.rrow .sc{font-weight:700;font-size:15px;text-align:right}
.rank{font-family:var(--display);color:var(--muted);margin-right:4px}
.pill{display:inline-block;font-size:10px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;border-radius:999px;padding:2px 6px;margin-left:5px;vertical-align:1px}
.pill.lucky{background:color-mix(in srgb,var(--good) 22%,transparent);color:var(--good)}
.pill.out{background:color-mix(in srgb,var(--bad) 22%,transparent);color:var(--bad)}

function sceneSVG(ci,levels,{interactive=false,id='s'}={}){
  const c=COUNTRIES[ci];
  let s=`<svg viewBox="${interactive?'0 0 390 600':'0 170 390 400'}" preserveAspectRatio="${interactive?'xMidYMax':'xMidYMid'} slice" role="img" aria-label="${c.city}, ${levels.reduce((a,b)=>a+b,0)} of 15 levels built" xmlns="http://www.w3.org/2000/svg" font-family="Outfit, system-ui, sans-serif">${sceneBG(ci,id)}`;
  const order=[4,2,3,1,0]; // back to front
  for(const i of order){
    const [x,y]=PLOTS[i], l=levels[i], h=HEIGHTS[ci][i][l]||50;
    const body=l===0?plot():DRAW[ci][i](l);
    if(!interactive){s+=`<g transform="translate(${x},${y})">${body}</g>`;continue}
    const cost=l<3?c.costs[l]:0, can=l<3&&E.coins>=cost;
    const name=c.sites[i], pw=name.length*6.2+34;
    s+=`<g class="lm ${popSite===i?'pop':''}" data-act="site" data-i="${i}" tabindex="0" role="button" aria-label="${name}, level ${l} of 3" transform="translate(${x},${y})">
      <rect x="-60" y="${-h-20}" width="120" height="${h+44}" fill="transparent"/>
      <g class="bodyg">${body}</g>
      <g transform="translate(0,14)"><rect class="pillbg" x="${-pw/2}" y="-9" width="${pw}" height="18" rx="9" fill="#fffaf0" stroke="#0a2226" stroke-opacity=".15"/>
        <text x="${-pw/2+10}" y="4" font-size="10.5" font-weight="700" fill="#1c2427">${name}</text>
        ${[0,1,2].map(k=>`<circle cx="${pw/2-22+k*7}" cy="0" r="2.6" fill="${k<l?'#e8a01c':'#d6cbb1'}"/>`).join('')}</g>
      ${can?`<g transform="translate(0,${-h-12})"><g class="up"><circle r="11" fill="#f2b33d" stroke="#2a1d04" stroke-width="1.5"/><path d="M0 5V-5M-4.5 -1L0 -5.5L4.5 -1" stroke="#2a1d04" stroke-width="2.2" fill="none" stroke-linecap="round" stroke-linejoin="round"/></g></g>`:''}
    </g>`;
  }
  return s+'</svg>';
}

const AUD=(()=>{
  let ctx=null, master, sfxBus, musicBus, verb, mverb, musicTimer=null;
  let prefs={sfx:true,music:true};
  try{prefs={...prefs,...JSON.parse(localStorage.getItem('yaniv-sound')||'{}')}}catch(e){}
  const save=()=>{try{localStorage.setItem('yaniv-sound',JSON.stringify(prefs))}catch(e){}};
  const mtof=m=>440*2**((m-69)/12);
  function impulse(sec){
    const len=ctx.sampleRate*sec, b=ctx.createBuffer(2,len,ctx.sampleRate);
    for(let ch=0;ch<2;ch++){const d=b.getChannelData(ch);for(let i=0;i<len;i++)d[i]=(Math.random()*2-1)*Math.pow(1-i/len,2.4)}
    return b;
  }
  function init(){
    if(ctx)return true;
    const AC=window.AudioContext||window.webkitAudioContext; if(!AC)return false;
    ctx=new AC();
    master=ctx.createGain(); master.gain.value=.9; master.connect(ctx.destination);
    sfxBus=ctx.createGain(); sfxBus.gain.value=prefs.sfx?1:0; sfxBus.connect(master);
    musicBus=ctx.createGain(); musicBus.gain.value=0; musicBus.connect(master);
    verb=ctx.createConvolver(); verb.buffer=impulse(2.2);

function validate(cards){
  const n=cards.length; if(!n) return null;
  if(n===1) return {type:'single',cards:[...cards]};
  const jok=cards.filter(c=>c.r===0), nat=cards.filter(c=>c.r!==0);
  if(!nat.length) return {type:'set',cards:[...cards]};
  if(nat.every(c=>c.r===nat[0].r)) return {type:'set',cards:[...nat,...jok]};
  if(n>=3&&n<=13&&nat.every(c=>c.s===nat[0].s)){
    const sorted=[...nat].sort((a,b)=>a.r-b.r);
    for(let i=1;i<sorted.length;i++) if(sorted[i].r===sorted[i-1].r) return null;
    const lo=sorted[0].r, hi=sorted[sorted.length-1].r, span=hi-lo+1;
    if(span>n) return null;
    const extra=n-span, addHigh=Math.min(extra,13-hi), start=lo-(extra-addHigh), end=hi+addHigh;
    const js=[...jok], out=[]; let k=0;
    for(let r=start;r<=end;r++){ if(k<sorted.length&&sorted[k].r===r) out.push(sorted[k++]); else out.push(js.pop()); }
    return {type:'run',cards:out};

function describe(v){
  const c=v.cards;

  const nat=c.find(x=>x.r!==0);
  if(v.type==='set'){const nm={2:'a pair',3:'three',4:'four',5:'five',6:'six'}[c.length]||c.length;return `${nm} of ${nat?rankName(nat.r):'Jokers'}`}
  return `a ${SUITS[nat.s]} run ${c.map(x=>rankLabel(x.r)).join('-')}`;
}

function loadRules(){try{const r=JSON.parse(localStorage.getItem('yaniv-rules')||'null');if(r)return {...DEFAULT_RULES,...r}}catch(e){}return {...DEFAULT_RULES}}
function saveRules(r){try{localStorage.setItem('yaniv-rules',JSON.stringify(r))}catch(e){}}
const active=()=>S.players.filter(p=>!p.out);
function nextActive(i){const n=S.players.length;for(let k=1;k<=n;k++){const j=(i+k)%n;if(!S.players[j].out)return j}return i}
function schedule(fn,ms){clearTimeout(timer);timer=setTimeout(fn,ms)}
function addLog(t){S.log.unshift(t);S.log=S.log.slice(0,2)}
const has=k=>(S.perks||[]).includes(k);
const myYanivAt=()=>S.g.yanivAt+(has('fado')?2:0);
const placementMode=()=>['sprint','champion','duel'].includes(S.mode);
function seat(list){
  S.players=[{name:'You',human:true,color:ME_COLOR,bot:null},...list].map(p=>({...p,hand:[],score:0,out:false,said:''}));
  S.round=1; S.log=[]; S.choice=null; S.used={};
}
const botSeat=i=>({...BOTS[i],human:false,bot:BOTS[i]});
function begin(mode,extra={}){
  clearTimeout(timer);
  Object.assign(S,{mode,choice:null,used:{},...extra});
  S.perks=['sprint','champion'].includes(mode)?[...E.equipped]:[];
  S.screen='table'; startRound();
}
function startSprint(){
  const m=E.mult; regen();
  if(E.tickets<m){toast(`You need ${m} ticket${m>1?'s':''}. Wait for a refill or grab free tickets.`);return}
  E.tickets-=m; saveEcon();
  S.g={...DEFAULT_RULES,yanivAt:C().yanivAt,handSize:5};
  seat([botSeat(0),botSeat(1),botSeat(2)]); S.starter=Math.floor(Math.random()*4);
  begin('sprint',{mult:m,cIdx:E.country});
}
function startChampion(){
  const ch=CHAMPS[E.country];
  if(E.coins<ch.fee){toast(`The entry is ${fmt(ch.fee)} coins. Win a few more rounds first.`);return}
  E.coins-=ch.fee; saveEcon(); bump('r-coin');
  S.g={...DEFAULT_RULES,yanivAt:C().yanivAt,handSize:5};
  seat([{...ch,human:false,bot:ch},{...botSeat(1),bot:{...BOTS[1],w:.85}},{...botSeat(2),bot:{...BOTS[2],style:'calc',w:.85}}]);
  S.starter=1;
  begin('champion',{cIdx:E.country,mult:1});
}
function startDuel(){
  const st=E.stake;
  if(E.coins<st){toast(`You need ${fmt(st)} coins for this duel.`);return}
  E.coins-=st; saveEcon(); bump('r-coin');
  S.g={...DEFAULT_RULES,yanivAt:7,handSize:5};
  seat([botSeat(E.rival)]); S.starter=Math.floor(Math.random()*2);
  begin('duel',{stake:st,mult:1,cIdx:E.country});
}
function startClassic(){
  S.g={...S.rules};
  seat(BOTS.slice(0,S.g.bots).map((_,i)=>botSeat(i))); S.starter=0;
  begin('classic');
}
function startRound(){
  S.deck=shuffle(newDeck()); S.buried=[]; S.used={}; SFX.deal();
  for(const p of S.players){p.hand=[];p.said='';if(!p.out){const n=p.human&&has('nata')?S.g.handSize-1:S.g.handSize;for(let k=0;k<n;k++)p.hand.push(S.deck.pop())}}
  S.last=[S.deck.pop()]; S.lastType='single'; S.lastBy=-1;
  S.turn=S.players[S.starter].out?nextActive(S.starter):S.starter;
  S.phase='play'; S.sel=new Set(); S.fresh=null; S.result=null; S.stamping=false; S.choice=null;
  addLog(S.turn===0?'You start.':`${S.players[S.turn].name} starts.`);
  render(); maybeBot();
}
function maybeBot(){if(S.screen==='table'&&S.phase==='play'&&!S.choice&&!S.players[S.turn].human)schedule(botTurn,1050)}
const pickpocketReady=()=>S.turn===0&&has('pick')&&!S.used.pick&&S.lastType==='run'&&S.last.length>2;
function pickable(){const L=S.last;if(S.lastType==='run'&&!pickpocketReady())return [0,L.length-1];return L.map((_,i)=>i)}
function drawCard(){if(!S.deck.length){S.deck=shuffle(S.buried);S.buried=[];addLog('Deck reshuffled.')}return S.deck.pop()}
function applyMove(pi,ids,take){
  const p=S.players[pi], idset=new Set(ids);
  const v=validate(p.hand.filter(c=>idset.has(c.id))); if(!v) return;
  p.hand=p.hand.filter(c=>!idset.has(c.id));
  const prev=S.last; let got;
  if(p.human&&take>0&&take<prev.length-1&&S.lastType==='run'){S.used.pick=true;toast('Pickpocket used.')}
  if(take>=0){got=prev[take];S.buried.push(...prev.filter((_,i)=>i!==take))}
  else{
    S.buried.push(...prev);
    if(p.human&&has('tram')&&!S.used.tram){
      const two=[drawCard(),drawCard()].filter(Boolean);
      S.last=v.cards; S.lastType=v.type; S.lastBy=pi; S.used.tram=true;
      addLog(`You dropped ${describe(v)} and rode Tram 28.`);SFX.drop();setTimeout(SFX.bell,150);
      S.sel=new Set(); S.choice=two; render(); return;
    }
    got=drawCard();
  }
  if(got)p.hand.push(got);
  S.last=v.cards; S.lastType=v.type; S.lastBy=pi;
  if(p.human){SFX.drop();setTimeout(take>=0?SFX.take:SFX.draw,140)}else{SFX.drop(.5);if(take>=0)setTimeout(SFX.take,120)}
  const src=take>=0?`took ${label(got)} from the pile`:(p.human&&got?`drew ${label(got)}`:'drew from the deck');
  addLog(`${p.name} dropped ${describe(v)}, ${src}.`);
  if(p.human){S.sel=new Set();S.fresh=got?got.id:null;if(S.mode==='tutorial')S.tut.step++}
  else{S.fresh=null;if(take>=0&&val(got)<=3&&Math.random()<.5)say(p,'take')}
  S.turn=nextActive(pi);
  if(S.turn===0&&S.players[0].hand.length)setTimeout(()=>{if(myTurn())SFX.turn(total(S.players[0].hand)<=myYanivAt())},350);
  render(); maybeBot();
}
function chooseTram(i){
  const keep=S.choice[i], other=S.choice[1-i];
  S.players[0].hand.push(keep); if(other)S.buried.push(other);
  S.fresh=keep.id; S.choice=null; addLog(`You kept ${label(keep)}.`); SFX.draw();
  S.turn=nextActive(0); render(); maybeBot();
}
function callYaniv(pi){
  clearTimeout(timer);
  const caller=S.players[pi], t=total(caller.hand);
  const others=active().filter(p=>p!==caller);
  const asafers=others.filter(p=>total(p.hand)<=t).sort((a,b)=>total(a.hand)-total(b.hand));
  const asaf=asafers.length>0;
  const base={caller:caller.name,callerHuman:caller.human,t,asaf,asafer:asaf?asafers[0].name:'',asaferT:asaf?total(asafers[0].hand):0};
  if(S.mode==='tutorial'){
    S.result={...base,rows:[]}; finishTutorial(); S.phase='tutorialEnd';
  } else if(placementMode()){
    const rest=others.filter(p=>!asafers.includes(p)).sort((a,b)=>total(a.hand)-total(b.hand));
    const order=asaf?[...asafers,...rest,caller]:[caller,...rest];
    const me=S.players[0], place=order.indexOf(me);
    const rows=order.map((p,i)=>({name:p.name,human:p.human,hand:[...p.hand],ht:total(p.hand),place:i,caller:p===caller,asafer:asafers.includes(p)}));
    S.result={...base,place,rows};
    if(S.mode==='sprint'){
      const c=COUNTRIES[S.cIdx];
      const insured=me===caller&&asaf&&has('shield');
      const pay=Math.round(c.reward*S.mult*(insured?PLACE_PCT[1]:PLACE_PCT[place]));
      const bonus=asafers.includes(me)?Math.round(pay*.5):0;
      Object.assign(S.result,{pay,bonus,insured}); addCoins(pay+bonus);
    } else if(S.mode==='champion'){
      if(place===0){
        const ch=CHAMPS[S.cIdx];
        if(!E.stamps.includes(ch.city))E.stamps.push(ch.city);
        if(COUNTRIES[E.country+1]&&E.country===S.cIdx)E.country++;
        E.tickets=Math.max(E.tickets,TICKET_CAP); addCoins(ch.prize);
        S.result.won=true;
      }
    } else if(S.mode==='duel'){
      if(place===0){S.result.won=true;addCoins(Math.round(S.stake*1.9))}
    }
    S.phase='matchEnd';
  } else {
    const rows=active().map(p=>{
      const ht=total(p.hand), isAsafer=asafers.includes(p);
      const add=p===caller?(asaf?ht+S.g.asafPenalty:0):(isAsafer?0:ht);
      p.score+=add; let lucky=false, out=false;
      if(S.g.lucky&&add>0&&p.score%50===0){p.score-=50;lucky=true}
      if(p.score>S.g.endScore){p.out=true;out=true}
      return {name:p.name,human:p.human,hand:[...p.hand],ht,add,score:p.score,lucky,out,caller:p===caller,asafer:isAsafer};
    });
    S.result={...base,rows};
    S.starter=asaf?S.players.indexOf(asafers[0]):pi;
    S.phase=(S.players[0].out||active().length<=1)?'gameOver':'roundEnd';
  }
  trackRound(S.result);
  S.stamping=true; S.sel=new Set(); render();
  runReveal(caller,t,others,asafers,()=>{S.stamping=false;render();setTimeout(resultSound,150)});
}
function showStamp(text,asaf){const st=$('stamp');st.hidden=false;st.classList.toggle('asaf',asaf);const t=$('stamp-t');t.textContent=text;t.style.animation='none';void t.offsetWidth;t.style.animation=''}
function shouldCall(p,t){
  const minCards=Math.min(...active().filter(o=>o!==p).map(o=>o.hand.length));
  const style=p.bot.style;
  if(style==='bold') return true;
  if(style==='calc') return t<=Math.max(1,minCards*2.2);
  return t<=3||minCards>=4;
}
function botTurn(){
  if(S.phase!=='play'||S.screen!=='table'||S.choice)return;
  const pi=S.turn,p=S.players[pi]; if(p.human)return;
  if(S.mode==='tutorial'){applyMove(pi,[NICO_MOVES[S.tut.nico++]],-1);return}
  const t=total(p.hand);
  if(t<=S.g.yanivAt&&shouldCall(p,t))return callYaniv(pi);
  const w=p.bot.w, L=S.last, picks=S.lastType==='run'?[0,L.length-1]:L.map((_,i)=>i); let best=null;
  for(const o of allSets(p.hand)){
    const ids=new Set(o.ids), rest=p.hand.filter(c=>!ids.has(c.id));
    const consider=(take,H,base)=>{const c=base-w*bestDump(H)+Math.random()*.6-o.pts*.01;if(!best||c<best.c)best={c,ids:o.ids,take}};
    consider(-1,rest,total(rest)+6.3);
    for(const i of picks){const H=[...rest,L[i]];consider(i,H,total(H))}
  }
  applyMove(pi,best.ids,best.take);
}
function say(p,kind){
  const lines=p.bot?.q?.[kind]; if(!lines)return;
  p.said=pickOne(lines);
  clearTimeout(bubbleTimers.get(p.name));
  bubbleTimers.set(p.name,setTimeout(()=>{p.said='';if(S.screen==='table')renderOpps()},2800));
}

/* ================= the reveal: Theo / Mateo moment ================= */
let revealTimers=[];
const rt=(fn,ms)=>revealTimers.push(setTimeout(fn,ms));
const reducedMotion=()=>window.matchMedia&&matchMedia('(prefers-reduced-motion: reduce)').matches;
function shake(){const ph=$('phone');ph.classList.remove('shake');void ph.offsetWidth;ph.classList.add('shake');setTimeout(()=>ph.classList.remove('shake'),500)}
function confetti(){
  if(reducedMotion())return;
  const box=document.createElement('div'); box.className='confetti';
  const cols=['#f2b33d','#f7c94f','#74d6a0','#7cc6e8','#f08a6c','#fbf6ea'];
  for(let i=0;i<70;i++){
    const p=document.createElement('i');
    p.style.cssText=`left:${Math.random()*100}%;background:${cols[i%cols.length]};--x:${(Math.random()-.5)*160}px;--r:${(Math.random()-.5)*900}deg;--d:${1.4+Math.random()*1.2}s;--dl:${Math.random()*.35}s`;
    box.appendChild(p);
  }
  $('phone').appendChild(box); setTimeout(()=>box.remove(),3200);
}
function quip(p,kind){const lines=p.bot?.q?.[kind];return lines?`<div class="rv-quote"><q>${pickOne(lines)}</q> <span>— ${p.name}</span></div>`:''}
function runReveal(caller,t,others,asafers,done){
  revealTimers.forEach(clearTimeout); revealTimers=[];
  const order=[...others].sort((a,b)=>total(b.hand)-total(a.hand)); // highest first, lowest (most dangerous) last
  const ov=$('reveal');
  const nm=p=>p.human?'You':p.name;
  const row=(p,i)=>`<div class="rv-row" id="rv-${i}" style="--av:${p.color}">
      <div class="av">${p.name[0]}</div>
      <div class="rv-mid"><b>${nm(p)}</b><div class="rv-cards">${p.hand.map(()=>'<div class="card back"></div>').join('')}</div></div>
      <div class="rv-score"><div class="rv-num" id="rvn-${i}">?</div><div class="rv-tag" id="rvt-${i}"></div></div>
    </div>`;
  ov.innerHTML=`<div class="rv-box">
      <div class="rv-call"><span class="rv-stamp">Theo!</span>
        <div class="rv-caller" style="--av:${caller.color}"><div class="av">${caller.name[0]}</div><span><b>${nm(caller)}</b> called at <b class="rv-t">${t}</b></span></div>
        <div class="rv-cards caller">${caller.hand.map(c=>cardHTML(c)).join('')}</div>
      </div>
      <div class="rv-beat">Who has ${t} or less?</div>
      <div class="rv-rows">${order.map(row).join('')}</div>
      <div class="rv-final" id="rv-final"></div>
      <div class="rv-skip">Tap to skip</div>
    </div>`;
  ov.hidden=false;
  SFX.callHit();
  let at=1000, finished=false, stopRiser=null;
  rt(()=>{stopRiser=SFX.riser(Math.max(1,(at-1000)/1000))},1000);
  const showRow=(p,i,silent)=>{
    const el=$('rv-'+i); el.classList.add('on');
    el.querySelectorAll('.rv-cards .card').forEach((slot,k)=>{slot.outerHTML=cardHTML(p.hand[k],{cls:silent?'':'flipin'})});
    $('rvn-'+i).textContent=total(p.hand);
  };
  const verdict=(p,i,silent)=>{
    const caught=total(p.hand)<=t, el=$('rv-'+i);
    el.classList.add(caught?'caught':'safe');
    $('rvt-'+i).textContent=caught?'Mateo!':'safe';
    if(!silent){if(caught){SFX.boom();shake()}else SFX.safe()}
  };
  order.forEach((p,i)=>{
    const ht=total(p.hand), n=p.hand.length, start=at, last=i===order.length-1;
    const flipGap=last?220:130, countDur=n*flipGap+200;
    rt(()=>$('rv-'+i).classList.add('on'),start);
    p.hand.forEach((c,k)=>rt(()=>{
      const slot=$('rv-'+i).querySelectorAll('.rv-cards .card')[k];
      if(slot)slot.outerHTML=cardHTML(c,{cls:'flipin'}); SFX.flip();
    },start+200+k*flipGap));
    const steps=Math.max(1,Math.min(ht,14));
    for(let s=1;s<=steps;s++)rt(()=>{$('rvn-'+i).textContent=Math.round(ht*s/steps);SFX.tick(s/steps)},start+200+countDur*s/steps);
    const vAt=start+200+countDur+(last?500:250);
    rt(()=>verdict(p,i,false),vAt);
    at=vAt+(last?150:450);
  });
  rt(()=>{if(stopRiser)stopRiser()},at);
  rt(finale,at+250);
  function finale(){
    if(finished)return; finished=true;
    const asaf=asafers.length>0, f=$('rv-final'), me=S.players[0];
    if(asaf){
      const a=asafers[0], good=a===me;
      f.innerHTML=`<div class="rv-big asaf ${good?'good':''}">MATEO!</div><p>${good?`You caught ${caller.name}!`:`${nm(a)} caught ${caller.human?'you':caller.name}.`}</p>${a.human?quip(caller,'burned'):quip(a,'asaf')}`;
      if(good){SFX.yaniv();confetti()}else SFX.asaf();
    } else {
      const good=caller===me;
      f.innerHTML=`<div class="rv-big">THEO!</div><p>${good?`Nobody beat your ${t}.`:`Nobody beat ${caller.name}'s ${t}.`}</p>${caller.human?'':quip(caller,'yaniv')}`;
      SFX.yaniv(); if(good)confetti();
    }
    ov.classList.add('done');
    rt(close,1900);
  }
  function close(){revealTimers.forEach(clearTimeout);revealTimers=[];ov.hidden=true;ov.classList.remove('done');ov.onclick=null;done()}
  ov.onclick=()=>{
    if(finished){close();return}
    revealTimers.forEach(clearTimeout); revealTimers=[];
    if(stopRiser)stopRiser();
    order.forEach((p,i)=>{showRow(p,i,true);verdict(p,i,true)});
    finale();
  };
}

/* ================= first-game lesson with Nico ================= */
const NICO={name:'Nico',city:'Hostel owner',color:'#9fd36b',style:'calc',w:.5,
  q:{burned:['Ha! You learn fast.'],asaf:['Mateo!'],yaniv:['Theo!'],take:['Thanks!']}};
const NICO_MOVES=['nJd','n7s','nQc'];
const TUT=[
  {need:'next',  text:'Lowest hand wins. Yours adds up to <b>32</b>. Kings count 10, Aces count 1.'},
  {need:'select',ids:['tKs','tKh'], text:'Two Kings make a <b>pair</b>. Tap both Kings to drop them together.'},
  {need:'pile',  idx:0, text:'Now take one card. Grab the <b>3♥</b> from the pile, it’s low.'},
  {need:'select',ids:['t9c'], text:'Nico dropped a Jack. Your turn: drop your highest card, the <b>9</b>.'},
  {need:'deck',  text:'This time draw from the <b>deck</b>. You never know what’s coming.'},
  {need:'select',ids:['t2h','p3h','d4h'], text:'<b>2♥ 3♥ 4♥</b> is a run: 3 or more in a row, same suit. Drop all three.'},
  {need:'deck',  text:'Nico dropped a 7. Too high to take. Draw from the <b>deck</b>.'},
  {need:'yaniv', text:'Your hand is <b>1</b>. With 7 or less you can call Theo. <b>Call it!</b>'},
];
const tutStep=()=>S.mode==='tutorial'?TUT[S.tut.step]:null;
function startTutorial(){
  clearTimeout(timer);
  $('ov-info').hidden=true; $('ov-round').hidden=true;
  const TC=(id,r,s)=>({id,r,s});
  S.g={...DEFAULT_RULES,yanivAt:7,handSize:5};
  seat([{...NICO,human:false,bot:NICO}]);
  Object.assign(S,{mode:'tutorial',perks:[],used:{},choice:null,cIdx:0,mult:1,tut:{step:0,nico:0}});
  const me=[TC('tKs',13,'S'),TC('tKh',13,'H'),TC('t9c',9,'C'),TC('t2h',2,'H'),TC('tAs',1,'S')];
  const nico=[TC('nJd',11,'D'),TC('n7s',7,'S'),TC('nQc',12,'C'),TC('n5c',5,'C'),TC('n6d',6,'D')];
  const draws=[TC('d3s',3,'S'),TC('d4h',4,'H'),TC('d2c',2,'C'),TC('dJk',0,'J'),TC('d4d',4,'D')]; // in the order they get drawn
  const pile=TC('p3h',3,'H');
  const taken=new Set([...me,...nico,...draws,pile].map(c=>c.r+c.s));
  const filler=shuffle(newDeck()).filter(c=>!taken.has(c.r+c.s));
  S.deck=[...filler,...draws.slice().reverse()]; S.buried=[];
  S.players[0].hand=me; S.players[1].hand=nico;
  S.last=[pile]; S.lastType='single'; S.lastBy=-1;
  S.turn=0; S.phase='play'; S.sel=new Set(); S.fresh=null; S.result=null; S.stamping=false; S.log=[];
  S.screen='table'; addLog('Nico deals you in.'); SFX.deal(); render();
}
function tutCardClick(id){
  const st=tutStep();
  if(S.turn!==0||!st||st.need!=='select'||!st.ids.includes(id)){SFX.nope();return}
  if(S.sel.has(id)){S.sel.delete(id);SFX.untap()}else{S.sel.add(id);SFX.tap()}
  if(S.sel.size===st.ids.length&&st.ids.every(x=>S.sel.has(x)))S.tut.step++;
  render();
}
function finishTutorial(){
  E.tutorialDone=true;
  if(!E.owned.includes('tram')){E.owned.push('tram');if(E.equipped.length<SLOTS)E.equipped.push('tram')}
  saveEcon();
}
function renderTutorialEnd(){
  const r=S.result, nicoT=total(S.players[1].hand);
  $('round-sheet').innerHTML=`<h2>You won your first hand!</h2>
    <p>Nico had ${nicoT}. Nobody matched your ${r.t}, so you win.</p>
    <div class="tut-note"><b>Watch out for Mateo.</b> If Nico had ${r.t} or less, he would have caught you, and you’d take the penalty instead.</div>
    <div class="gift"><div class="perk-art">${perkArt('tram')}</div><div><small>Welcome gift</small><b>Tram 28</b><p>${PERKS.tram.text}</p><span>Added to your deck</span></div></div>
    <div class="foot"><button class="btn primary wide" type="button" data-act="tutdone">Play in Lisbon</button></div>`;
}
function openWelcome(){
  S.welcomeShown=true;
  $('info-sheet').innerHTML=`<div class="welcome">
      <div class="av big" style="--av:${NICO.color}">N</div>
      <h2>Welcome to the hostel</h2>
      <p>I’m Nico, I run the place. Every night the travelers here play <b>Theo!</b>, the card game backpackers carry around the world.</p>
      <p>Let me teach you in one quick hand. It takes about a minute.</p>
      <div class="foot col"><button class="btn primary wide" type="button" data-act="tutstart">Teach me</button>
      <button class="btn wide" type="button" data-act="tutskip">I know how to play, skip</button></div>
    </div>`;
  $('ov-info').hidden=false;
}

/* ================= testers: stats, feedback, sharing ================= */
const GAME_URL='https://yuvalbuk07-boop.github.io/yaniv-hostel/';
const VERSION='v11';
// Google Form wiring. Filled in from the form's pre-filled link; null = feedback hidden.
const FORM=null;
const SHARE_TEXT=`I'm testing Theo!, a card game backpackers play around the world. Lowest hand shouts Theo… unless someone shouts Mateo. Try it on your phone: ${GAME_URL}\n(iPhone: open in Safari, tap Share, then "Add to Home Screen")`;
function trackDay(){
  E.stats=E.stats||{rounds:0,wins:0,caught:0,catches:0,duels:0,days:[]};
  if(!E.stats.days.includes(today())){E.stats.days.push(today());saveEcon()}
}
function trackRound(r){
  if(S.mode==='tutorial'||!r)return;
  const st=E.stats; st.rounds++;
  const meCalled=r.callerHuman, meWon=r.place===0||(S.mode==='classic'&&r.rows.find(x=>x.human)?.add===0);

  if(r.asaf&&r.asafer==='You')st.catches++;
  if(S.mode==='duel')st.duels++;
  saveEcon();
}

  } else if(S.mode==='champion'){
    const ch=CHAMPS[S.cIdx], next=COUNTRIES[S.cIdx+1];
    box=r.won?`<div class="prize"><span class="place">${c.city} stamp</span><span class="amt"><span class="ic-coin"></span>+${fmt(ch.prize)}</span><small>${next?`You beat ${ch.name}. Next stop: ${next.city}, where Theo is called at ${next.yanivAt} or less.`:`You beat ${ch.name}. That's the end of this prototype's route.`}</small></div>`
      :`<div class="prize lost"><span class="place">${['1st','2nd','3rd','4th'][r.place]} place</span><small>${ch.name} keeps the title for now. Power up your deck and try again.</small></div>`;
    foot=r.won?`<button class="btn primary" type="button" data-act="tab" data-tab="play">${next?`Travel to ${next.city}`:'Back'}</button>`
      :`<button class="btn" type="button" data-act="tab" data-tab="deck">Back to the market</button><button class="btn primary" type="button" data-act="champion" ${E.coins>=ch.fee?'':'disabled'}>Try again · ${fmt(ch.fee)}</button>`;
  } else {
    const opp=S.players[1].name, rev=S.stake*2;
    box=r.won?`<div class="prize"><span class="place">You win the duel</span><span class="amt"><span class="ic-coin"></span>+${fmt(S.stake*1.9)}</span><small>${opp} will want a rematch.</small></div>`
      :`<div class="prize lost"><span class="place">${opp} wins</span><small>You lost your ${fmt(S.stake)} coin stake.</small></div>`;
    foot=`<button class="btn" type="button" data-act="tab" data-tab="friends">Back</button>${r.won?`<button class="btn primary" type="button" data-act="duel">Rematch · ${fmt(S.stake)}</button>`:`<button class="btn primary" type="button" data-act="revenge" ${E.coins>=rev?'':'disabled'}>Revenge · ${fmt(rev)}</button>`}`;
  }
  $('round-sheet').innerHTML=`<h2 class="${r.asaf?'asaf':''}">${r.asaf?'Mateo!':'Theo!'}</h2><p>${headline(r)}</p>${box}<div class="rtable">${rows}</div><div class="foot">${foot}</div>`;
}
function ordinal(n){return n+(['th','st','nd','rd'][(n%100-20)%10]||['th','st','nd','rd'][n%100]||'th')}
function renderResult(){
  const r=S.result;
  const line=headline(r)+(r.asaf?` ${r.callerHuman?'You take':r.caller+' takes'} the hand plus ${S.g.asafPenalty}.`:' Everyone else adds their hand.');
  const rows=r.rows.map(x=>`<div class="rrow ${x.human?'me':''}">
      <div class="nm">${x.name}${x.caller?'<span class="pill call">called</span>':''}${x.asafer?'<span class="pill lucky">mateo</span>':''}${x.lucky?'<span class="pill lucky">−50</span>':''}${x.out?'<span class="pill out">out</span>':''}<small>hand ${x.ht}</small></div>
      <span class="add ${x.add===0?'zero':(x.caller?'hit':'')}">+${x.add}</span><span class="sc">${x.score}</span>
      <div class="mini">${x.hand.map(c=>cardHTML(c)).join('')}</div></div>`).join('');
  let foot;
  if(S.phase==='gameOver'){
    const me=S.players[0], standings=[...S.players].sort((a,b)=>(a.out-b.out)||(a.score-b.score)), place=standings.indexOf(me)+1;
    foot=`<p style="margin-top:12px"><b>${me.out?`You went over ${S.g.endScore}. You finished ${ordinal(place)} of ${S.players.length}.`:`You're the last one at the table.`}</b></p><div class="foot"><button class="btn" type="button" data-act="leave">Leave</button><button class="btn primary" type="button" data-act="classic">Play again</button></div>`;
  } else foot=`<div class="foot"><button class="btn" type="button" data-act="leave">Leave</button><button class="btn primary" type="button" data-act="next">Next round</button></div>`;
  $('round-sheet').innerHTML=`<h2 class="${r.asaf?'asaf':''}">${r.asaf?'Mateo!':'Theo!'}</h2><p>${line}</p><div class="rtable">${rows}</div>${foot}`;
}

/* ================= info sheets ================= */
function openRules(){
  const y=S.screen==='table'?S.g.yanivAt:C().yanivAt;
  $('info-sheet').innerHTML=`<h2>How to play</h2>
  <ol class="howto">
    <li><b>Lowest hand wins.</b> A = 1, 2–10 = their number, J Q K = 10, Joker = 0.</li>
    <li><b>Drop</b> one card, same numbers (7-7), or 3+ in a row of one suit (4-5-6♥).</li>
    <li><b>Draw</b> one card: from the deck, or the card the last player dropped.</li>
    <li><b>Hand ${y} or less?</b> Call Theo at the start of your turn.</li>
    <li><b>Mateo!</b> If someone has the same or less, they shout Mateo, catch you and win.</li>
    <li><b>Power cards</b> bend the rules in your favour. Buy them with coins and pick 3 for your deck.</li>
  </ol>
  <div class="foot"><button class="btn primary" type="button" data-act="close">Got it</button></div>`;
  $('ov-info').hidden=false;
}
function openSettings(){
  resetArmed=false;
  $('info-sheet').innerHTML=`<h2>Settings</h2>
    <div class="form">
      <div class="field"><label for="s-sfx">Sound effects<small>Cards, coins, Theo and Mateo</small></label><input type="checkbox" id="s-sfx"></div>
      <div class="field"><label for="s-music">Music<small>A chill lounge beat, different in each city</small></label><input type="checkbox" id="s-music"></div>
      ${FORM?'<div class="field"><label>Send feedback<small>Tell us what to fix</small></label><button class="btn" type="button" data-act="feedback">Open</button></div>':''}
      <div class="field"><label>Share the game<small>Invite a friend to test</small></label><button class="btn" type="button" data-act="share">Share</button></div>
      <div class="field"><label>Lesson with Nico<small>Replay the one-hand tutorial</small></label><button class="btn" type="button" data-act="tutstart">Play</button></div>
      <div class="field"><label>How to play<small>The rules in six lines</small></label><button class="btn" type="button" data-act="rules">Open</button></div>
      <div class="field"><label>Reset progress<small>Prototype only: coins, tickets and cards</small></label><button class="btn" type="button" data-act="reset">Reset</button></div>
    </div>
    <div class="foot"><button class="btn primary" type="button" data-act="close">Done</button></div>`;
  $('ov-info').hidden=false;
  const p=AUD.prefs(); $('s-sfx').checked=p.sfx; $('s-music').checked=p.music;
  $('s-sfx').onchange=e=>{AUD.set('sfx',e.target.checked);renderMute();SFX.click()};
  $('s-music').onchange=e=>{AUD.set('music',e.target.checked);renderMute()};
}

/* ================= render ================= */
function render(){
  const scr=S.screen, playing=scr==='table';
  $('phone').classList.toggle('playing',playing);
  for(const k of ['play','deck','friends','table'])$('scr-'+k).hidden=k!==scr;
  for(const k of ['play','deck','friends'])$('nav-'+k).setAttribute('aria-current',k===scr?'page':'false');
  renderEcon(); renderMute();
  if(scr==='play'){renderPlay();if(!E.tutorialDone&&!S.welcomeShown)openWelcome()}
  else if(scr==='deck')renderDeck();
  else if(scr==='friends')renderFriends();
  else renderTable();
  if(!playing)$('ov-round').hidden=true;
}
function goTab(t){SFX.click();clearTimeout(timer);S.screen=t;S.phase='idle';S.choice=null;$('ov-round').hidden=true;render();$('scr-'+t).scrollTop=0}

/* ================= input ================= */
document.addEventListener('click',e=>{
  const el=e.target.closest('[data-act]'); if(!el)return;
  const act=el.dataset.act;
  if(act==='close-bg'){if(e.target===el)el.hidden=true;return}
  if(act==='card'&&S.mode==='tutorial'&&S.screen==='table'){if(S.phase==='play')tutCardClick(el.dataset.id);return}
  if(act==='card'){if(S.phase!=='play')return;const id=el.dataset.id;if(S.sel.has(id)){S.sel.delete(id);SFX.untap()}else{S.sel.add(id);SFX.tap()}S.fresh=null;render()}
  else if(act==='deck'&&tutStep()&&tutStep().need!=='deck'){SFX.nope()}
  else if(act==='deck'){const {v}=selection();if(myTurn()&&v)applyMove(0,[...S.sel],-1);else if(myTurn())SFX.nope()}
  else if(act==='pile'&&tutStep()&&tutStep().need!=='pile'){SFX.nope()}
  else if(act==='pile'){const {v}=selection();const i=+el.dataset.i;if(myTurn()&&v&&pickable().includes(i))applyMove(0,[...S.sel],i)}
  else if(act==='choose'){if(S.choice)chooseTram(+el.dataset.i)}
  else if(act==='yaniv'&&tutStep()&&tutStep().need!=='yaniv'){SFX.nope()}
  else if(act==='yaniv'){if(myTurn()&&total(S.players[0].hand)<=myYanivAt()){S.sel=new Set();callYaniv(0)}}
  else if(act==='sort'){S.sortBy=S.sortBy==='suit'?'rank':'suit';render()}
  else if(act==='next'){S.round++;startRound()}
  else if(act==='sprint'){$('ov-round').hidden=true;startSprint()}
  else if(act==='champion'){$('ov-round').hidden=true;startChampion()}
  else if(act==='duel'){$('ov-round').hidden=true;startDuel()}
  else if(act==='revenge'){E.stake=S.stake*2;saveEcon();$('ov-round').hidden=true;startDuel()}
  else if(act==='classic'){$('ov-round').hidden=true;startClassic()}
  else if(act==='leave'){goTab(S.mode==='classic'||S.mode==='duel'?'friends':(S.mode==='champion'?'deck':'play'))}
  else if(act==='tab'){goTab(el.dataset.tab)}
  else if(act==='mult'){SFX.click();E.mult=+el.dataset.m;saveEcon();render()}
  else if(act==='stake'){SFX.click();E.stake=+el.dataset.v;saveEcon();render()}
  else if(act==='rival'){SFX.click();E.rival=+el.dataset.i;saveEcon();render()}
  else if(act==='buy'){buyPerk(el.dataset.k)}
  else if(act==='equip'){toggleEquip(el.dataset.k)}
  else if(act==='daily'){if(E.dailyDay!==today()){E.dailyDay=today();E.tickets+=5;bump('r-tix');addCoins(C().reward/2);SFX.coins();toast(`+5 tickets and +${fmt(C().reward/2)} coins`);render()}}
  else if(act==='ad'){if(E.adsDay!==today()){E.adsDay=today();E.ads=0}if(E.ads<ADS_PER_DAY){E.ads++;E.tickets+=2;saveEcon();bump('r-tix');SFX.coins();toast('+2 tickets (simulated ad)');render()}}
  else if(act==='reset'){if(!resetArmed){resetArmed=true;el.textContent='Tap again';return}E=freshEcon();saveEcon();$('ov-info').hidden=true;goTab('play');toast('Progress reset.')}
  else if(act==='rules'){openRules()}
  else if(act==='settings'){openSettings()}
  else if(act==='share'){shareGame()}
  else if(act==='feedback'){SFX.click();openFeedback()}
  else if(act==='fblater'){E.fbLater=E.stats.rounds+10;saveEcon();render()}
  else if(act==='fbstar'){fb.fun=+el.dataset.v;SFX.tap();fbPaint()}
  else if(act==='fbchip'){fb[el.dataset.k]=el.dataset.v;SFX.tap();fbPaint()}
  else if(act==='fbsend'){sendFeedback()}
  else if(act==='tutnext'){S.tut.step++;SFX.click();render()}
  else if(act==='tutstart'){startTutorial()}
  else if(act==='tutskip'){E.tutorialDone=true;saveEcon();$('ov-info').hidden=true}
  else if(act==='tutdone'){$('ov-round').hidden=true;goTab('play');toast('Win rounds to earn coins, then spend them in the Deck tab.')}
  else if(act==='mute'){const p=AUD.prefs(),on=p.sfx||p.music;AUD.set('sfx',!on);AUD.set('music',!on);renderMute();if(!on)SFX.click()}
  else if(act==='close'){el.closest('.ov').hidden=true}
});
document.addEventListener('keydown',e=>{if(e.key==='Escape')$('ov-info').hidden=true});
setInterval(()=>{
  if(regen()){bump('r-tix');if(S.screen==='play')renderPlay()}
  renderEcon(); renderTicketNote();
  const cta=document.querySelector('.cta'); if(cta)cta.disabled=E.tickets<E.mult;
},1000);

/* ================= boot (keeps the game across live updates) ================= */
window.claude?.hot?.snapshot?.(()=>({S:{...S,sel:[...(S.sel||[])],stamping:false},uid}));
function start(data){
  E=loadEcon(); regen(); trackDay();
  if(data&&data.S&&data.S.g&&data.S.v===4){
    S={...data.S,sel:new Set(data.S.sel||[])};uid=data.uid||5000;
    render();maybeBot();
  } else {
    S={v:4,rules:loadRules(),sortBy:'rank',log:[],screen:'play',phase:'idle',players:[],sel:new Set(),perks:[],used:{}};
    render();
  }
}
window.claude?.hot?.ready?window.claude.hot.ready(start):start(window.claude?.hot?.data??{});

</script>
